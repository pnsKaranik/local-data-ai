[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_assistant"
version = "0.0.1"
description = "Offline, on-premise AI assistant for business data (PostgreSQL, Excel, PDF)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "duckdb>=1.1,<2",
    "sqlglot>=25,<31",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "umap-learn>=0.5.6,<1",
    "openpyxl>=3.1,<4",
    "python-calamine>=0.2,<1",
    "PyMuPDF>=1.24,<2",
    "rapidfuzz>=3.6,<4",
    "PyYAML>=6,<7",
    "argon2-cffi>=23,<26",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2,<4",
    "defusedxml>=0.7,<1",
    "toon-format>=0.9.0b1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5"
]

[tool.setuptools.packages.find]
include = ["data_assistant*", "eval*"]

[tool.setuptools.package-data]
data_assistant = ["web/static/*", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"eval/*" = ["S"]